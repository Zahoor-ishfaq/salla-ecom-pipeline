# ============================================================================
# Salla E-Commerce Pipeline — Deploy
# ============================================================================
# - Push to main  → deploy to dev (paused schedule)
# - Git tag v*    → deploy to prod (unpaused schedule)
# ============================================================================

name: "CD — Deploy Bundle"

on:
  push:
    branches: [main]
    paths:
      - 'databricks.yml'
      - 'bronze-layer/**'
      - 'silver-layer/**'
      - 'gold-layer/**'
      - 'sources/**'
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  # ── Deploy to Dev on push to main ────────────────────────────────────
  deploy-dev:
    name: Deploy to Dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to dev
        run: databricks bundle deploy --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Run full pipeline (Bronze → Silver → Gold)
        run: |
          databricks bundle run salla_orchestration --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  # ── Deploy to Prod on release tag ────────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to prod
        run: databricks bundle deploy --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_PROD_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}
